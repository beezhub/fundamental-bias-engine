# Apply with any label-sync action, or create by hand. Exactly one status label
# per issue, always.

- { name: "type:defect",           color: "d73a4a", description: "Something is wrong in code, spec, or between them" }
- { name: "type:debt",             color: "fbca04", description: "Not wrong, but will cost later" }
- { name: "type:question",         color: "d876e3", description: "A decision is needed before work can start" }
- { name: "type:proposal",         color: "0e8a16", description: "An improvement. Never implemented without human approval" }
- { name: "type:requirement",      color: "1d76db", description: "An approved proposal, written so it can be built" }

- { name: "status:needs-decision", color: "e99695", description: "Blocked on an answer from the architect" }
- { name: "status:needs-approval", color: "b60205", description: "Awaiting a human. No agent may advance this" }
- { name: "status:ready",          color: "0e8a16", description: "Every question answered. Claimable" }
- { name: "status:in-progress",    color: "fef2c0", description: "Claimed. The claimant is named in a comment" }
- { name: "status:blocked",        color: "5319e7", description: "Started then stopped. The comment says on what" }

- { name: "area:data",             color: "c5def5", description: "datasources, registry, caching" }
- { name: "area:scoring",          color: "c5def5", description: "pillars, scoring, bias" }
- { name: "area:risk",             color: "c5def5", description: "sizing, limits, journal" }
- { name: "area:execution",        color: "c5def5", description: "calendar guard, broker constraints" }
- { name: "area:interface",        color: "c5def5", description: "cli, report, dashboard" }
- { name: "area:reasoning",        color: "c5def5", description: "the written brief" }
- { name: "area:infra",            color: "c5def5", description: "ci, tooling, packaging" }
- { name: "area:docs",             color: "c5def5", description: "specifications and guides" }

- { name: "p0", color: "b60205", description: "A wrong number is reaching the trader now" }
- { name: "p1", color: "d93f0b", description: "Wrong behaviour, not yet reaching the trader" }
- { name: "p2", color: "fbca04", description: "Real but bounded" }
- { name: "p3", color: "0e8a16", description: "Minor" }

- { name: "roadmap", color: "5319e7", description: "Delivers a roadmap phase. The build desks claim this pool, the maintenance desk never does" }

- { name: "phase:0", color: "e4e0f7", description: "docs/roadmap.md Phase 0: contracts and documentation" }
- { name: "phase:1", color: "d9d2f5", description: "docs/roadmap.md Phase 1: the data layer" }
- { name: "phase:2", color: "cec4f2", description: "docs/roadmap.md Phase 2: the MONETARY pillar, end to end" }
- { name: "phase:3", color: "c3b6f0", description: "docs/roadmap.md Phase 3: the remaining six pillars" }
- { name: "phase:4", color: "b8a8ed", description: "docs/roadmap.md Phase 4: risk sizing and the calendar guard" }
- { name: "phase:5", color: "ad9aeb", description: "docs/roadmap.md Phase 5: report and dashboard" }
- { name: "phase:6", color: "a28ce8", description: "docs/roadmap.md Phase 6: journal-based evaluation" }

- { name: "run:planning",    color: "006b75", description: "Filed or opened by the weekday 05:00 planning desk, the run that decomposes the roadmap" }
- { name: "run:triage",      color: "0a7d8c", description: "Filed or opened by the weekday 06:00 and 12:00 triage desk" }
- { name: "run:maintenance", color: "1391a3", description: "Opened by the maintenance desk, the lane that claims routine-safe work" }
- { name: "run:build-a",     color: "1aa6ba", description: "Opened by build desk A, which works up from the lowest unblocked roadmap issue" }
- { name: "run:build-b",     color: "22bcd1", description: "Opened by build desk B, which works down from the highest unblocked roadmap issue" }
- { name: "run:audit",       color: "2bd2e8", description: "Filed by the Saturday audit desk" }
- { name: "run:proposals",   color: "35e8ff", description: "Filed by the Sunday proposals desk" }

- { name: "routine-safe", color: "bfd4f2", description: "An unattended agent may take this without a human" }
- { name: "routine-hold", color: "b60205", description: "Stops any unattended run from claiming this issue. Only a human adds or removes it" }
- { name: "approved",     color: "0e8a16", description: "A human approved this proposal. The improve routine converts it to a requirement" }
