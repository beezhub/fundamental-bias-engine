name: Sync labels

# Labels applied when an issue is created are auto-created by the GitHub API
# with a default grey and no description, so a backlog filed through the API
# arrives unreadable. This puts the colours and descriptions back from
# .github/labels.yml, which is the source of truth.

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - "scripts/sync_labels.py"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Report what differs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_labels.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --dry-run
      - name: Apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_labels.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}"
