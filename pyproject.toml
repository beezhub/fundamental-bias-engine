[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fundamental-bias-engine"
version = "0.1.0"
description = "Relative-value fundamental directional bias model for G10 FX"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "python-dateutil>=2.9",
  # The Bank of England publishes its gilt yield curve only as a workbook,
  # and it is the sole free source for the 2y point that drives 21% of
  # every currency score. Without a reader, GBP loses the monetary pillar.
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
  # src now imports yaml under mypy, which has no inline types of its own.
  "types-PyYAML>=6.0",
  # and openpyxl, for the Bank of England yield curve workbook.
  "types-openpyxl>=3.1",
]

[project.scripts]
fbe = "fbe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fbe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["fbe"]
warn_unused_ignores = true
disallow_untyped_defs = true
